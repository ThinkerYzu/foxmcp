[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "foxmcp"
version = "1.4.0"
description = "Connect MCP clients to your Firefox browser"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "websockets>=15.0",
    "httpx>=0.27",
    "fastmcp>=3.0.0,<4",
    "uvicorn>=0.31.1",
    "pydantic>=2.11.7",
]

[project.urls]
Homepage = "https://github.com/ThinkerYzu/foxmcp"
Issues = "https://github.com/ThinkerYzu/foxmcp/issues"

[project.scripts]
foxmcp = "foxmcp.cli:main"

[tool.hatch.build.targets.wheel]
only-include = ["server", "predefined-ex"]

[tool.hatch.build.targets.wheel.sources]
server = "foxmcp"
predefined-ex = "foxmcp/examples"

[tool.hatch.build.targets.sdist]
include = ["/server", "/predefined-ex", "/README.md", "/LICENSE", "/pyproject.toml"]
