name: CI

# Runs the checks the maintainer runs locally, on every push and pull request.
# Nothing here publishes anything, so it needs no secrets and only read access.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - name: Install flake8
        run: venv/bin/pip install flake8

      # Split in two on purpose. `make lint` ends every flake8 call with
      # `|| echo`, so it reports style problems and then exits 0 whatever it
      # found — useful locally, useless as a gate. Real errors fail the build
      # here; style is advisory, matching what the Makefile intended.
      - name: Fail on syntax errors and undefined names
        run: venv/bin/flake8 server/ tests/ scripts/check-test-report.py --select=E9,F63,F7,F82 --show-source

      - name: Report style issues
        run: venv/bin/flake8 server/ tests/ scripts/check-test-report.py --max-line-length=100 --ignore=E203,W503 --exit-zero

  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python }}
      - run: make package
      - name: Run unit tests
        env:
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/unit.xml
        run: make test-unit
      - name: Require every unit module to pass without skips
        if: always()
        run: venv/bin/python scripts/check-test-report.py "$RUNNER_TEMP/unit.xml" --kind unit

  suite:
    name: Full suite
    runs-on: ubuntu-latest
    # The suite takes about ten minutes locally against real Firefox. The cap is
    # generous enough for a slow runner and still catches a hang.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - uses: ./.github/actions/setup-firefox

      - name: Run the suite
        env:
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/junit.xml
        run: make test

      - name: Require every unit and integration module to pass without skips
        if: always()
        run: venv/bin/python scripts/check-test-report.py "$RUNNER_TEMP/junit.xml"

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: ${{ runner.temp }}/junit.xml

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: tests/htmlcov/
          if-no-files-found: ignore

  install:
    name: Install from source (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    # Follows README's from-source instructions on a clean checkout, because the
    # rest of CI does not: setup-python-env creates the venv itself and runs
    # `make setup`, so `make install` — what the README tells a user to run — is
    # never exercised. Check the documented minimum Python as well as the suite's
    # interpreter, including HTTP and stdio MCP startup without test fixtures.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: make install, as README says
        run: make install

      - name: Start the server, and ask it for its tools
        shell: bash
        run: |
          set -euo pipefail
          venv/bin/python server/server.py --port 18765 --mcp-port 13000 &
          server_pid=$!
          trap 'kill $server_pid' EXIT

          # A live MCP endpoint answers /mcp/ with a 307 to /mcp, which -f treats
          # as success; -f fails only from 400 up, and a refused connection is a
          # curl error either way.
          for _ in $(seq 30); do
            curl -sf -o /dev/null http://localhost:13000/mcp/ && break
            sleep 1
          done

          venv/bin/python - <<'PY'
          import asyncio
          from fastmcp import Client

          EXPECTED = 41

          async def main():
              async with Client("http://localhost:13000/mcp/") as client:
                  names = sorted(tool.name for tool in await client.list_tools())
                  print(f"{len(names)} tools: {', '.join(names)}")
                  assert len(names) == EXPECTED, f"expected {EXPECTED} tools, got {len(names)}"

          asyncio.run(main())
          PY

      - name: A disabled group must not reach the client
        shell: bash
        run: |
          set -euo pipefail
          venv/bin/python server/server.py --port 18766 --mcp-port 13001 \
            --disable-tools bookmarks,history &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 5

          venv/bin/python - <<'PY'
          import asyncio
          from fastmcp import Client

          async def main():
              async with Client("http://localhost:13001/mcp/") as client:
                  names = {tool.name for tool in await client.list_tools()}
                  assert len(names) == 31, f"expected 31 tools, got {len(names)}"
                  assert not [n for n in names if n.startswith(("bookmarks_", "history_"))]
                  assert "tabs_list" in names

          asyncio.run(main())
          PY

      - name: A client must be able to launch the server over stdio
        shell: bash
        run: |
          set -euo pipefail
          # No background server here: the client starts it, which is the mode.
          venv/bin/python - <<'PY'
          import asyncio
          from fastmcp import Client
          from fastmcp.client.transports import PythonStdioTransport

          EXPECTED = 41

          async def main():
              transport = PythonStdioTransport(
                  script_path="server/server.py",
                  args=["--stdio", "--port", "18768"],
              )
              async with Client(transport) as client:
                  names = sorted(tool.name for tool in await client.list_tools())
                  print(f"{len(names)} tools over stdio: {', '.join(names)}")
                  assert len(names) == EXPECTED, f"expected {EXPECTED} tools, got {len(names)}"

                  # Reaches the bridge and comes back as a result rather than a
                  # protocol error, which is what a stray write to stdout would be.
                  result = await client.call_tool("tabs_list", {})
                  assert "No extension connection" in result.content[0].text

          asyncio.run(main())
          PY

      - name: A tool named individually must survive its disabled group
        shell: bash
        run: |
          set -euo pipefail
          venv/bin/python server/server.py --port 18767 --mcp-port 13002 \
            --disable-tools tabs --enable-tools tabs_capture_screenshot &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 5

          venv/bin/python - <<'PY'
          import asyncio
          from fastmcp import Client

          async def main():
              async with Client("http://localhost:13002/mcp/") as client:
                  names = {tool.name for tool in await client.list_tools()}
                  assert len(names) == 32, f"expected 32 tools, got {len(names)}"
                  assert "tabs_capture_screenshot" in names
                  assert not [n for n in names
                              if n.startswith("tabs_") and n != "tabs_capture_screenshot"]

          asyncio.run(main())
          PY

  package:
    name: Test final release packages
    needs: [lint, unit, suite, install]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - uses: ./.github/actions/setup-firefox
      - run: make package
      - name: Exercise every tool from these exact archives over HTTP and stdio
        run: >-
          venv/bin/python tests/package_smoke.py --packages dist/packages
          --work-dir "$RUNNER_TEMP/package-smoke"
      - name: Keep package smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke
          path: |
            ${{ runner.temp }}/package-smoke/*.log
            ${{ runner.temp }}/package-smoke/receipts.json
            ${{ runner.temp }}/package-smoke/smoke-*.json
            ${{ runner.temp }}/package-smoke/smoke-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/packages/
          if-no-files-found: error
