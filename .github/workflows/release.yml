name: Release

# Builds and publishes a release from a tag, in public, from this repository's
# source. Answers https://github.com/ThinkerYzu/foxmcp/issues/1 — the artifact a
# user installs should be traceable to the commit it was built from, without
# taking the maintainer's word for it.
#
# GitHub actions build and attest release artifacts; PyPA's publishing action
# uploads the tested Python distributions with OIDC. Only the AMO job reaches
# the web-ext signing credentials.
#
# Two ways in:
#   - push a tag v1.2.0            builds, publishes, submits to AMO
#   - run it by hand with a version  verifies and builds, publishes nothing

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse, e.g. 1.2.0. No tag, no release, no PyPI or AMO upload.'
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version, and whether this run publishes
        id: resolve
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${DISPATCH_VERSION#v}"
            publish=false
          else
            version="${GITHUB_REF_NAME#v}"
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version, publish=$publish"

      - name: Every file must agree with the tag
        run: scripts/check-version.sh "${{ steps.resolve.outputs.version }}"

      - name: The changelog must have something to say
        run: scripts/release-notes.sh "${{ steps.resolve.outputs.version }}"

  checks:
    name: Release checks
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    name: Verify and attest tested packages
    needs: [verify, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Both are needed to sign the provenance statement.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/packages
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/python

      - name: Verify tested archive checksums
        working-directory: dist/packages
        run: sha256sum --check --strict SHA256SUMS

      - name: Verify tested Python distribution checksums
        working-directory: dist/python
        run: sha256sum --check --strict PYTHON-SHA256SUMS

      # This is the part that answers issue #1. The attestation is a signed
      # statement that these exact bytes came out of this workflow, at this
      # commit, in this repository. Anyone can check it without trusting us:
      #   gh attestation verify foxmcp@codemud.org.xpi --repo ThinkerYzu/foxmcp
      - name: Attest where these artifacts came from
        if: needs.verify.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/packages/foxmcp@codemud.org.xpi
            dist/packages/foxmcp-server.zip
            dist/python/packages/*

  github-release:
    name: Publish the GitHub release
    needs: [verify, build]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/packages
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/python

      - name: Verify archives before publishing
        working-directory: dist/packages
        run: sha256sum --check --strict SHA256SUMS

      - name: Verify tested Python distribution checksums
        working-directory: dist/python
        run: sha256sum --check --strict PYTHON-SHA256SUMS

      - name: Write the release notes
        run: scripts/release-notes.sh "${{ needs.verify.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      # install-from-github.sh ships as a release asset because README.md tells
      # users to curl it straight from the release URL.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "FoxMCP v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            'dist/packages/foxmcp@codemud.org.xpi' \
            dist/packages/foxmcp-server.zip \
            dist/packages/SHA256SUMS \
            scripts/install-from-github.sh \
            dist/python/packages/* \
            dist/python/PYTHON-SHA256SUMS

  amo:
    name: Submit to addons.mozilla.org
    needs: [verify, build, github-release]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # The credential gate. Configure this environment in repository settings with
    # required reviewers and a branch/tag restriction, so the AMO keys are only
    # reachable from a tag release someone approved — not from any workflow
    # change that happens to land on master.
    environment: amo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --global web-ext@8

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/packages

      - name: Use the tested extension for AMO submission
        run: |
          cd dist/packages
          sha256sum --check --strict SHA256SUMS
          mkdir -p ../extension
          unzip -q 'foxmcp@codemud.org.xpi' -d ../extension

      # --channel=listed submits the version to the public AMO listing, where it
      # enters Mozilla's review queue. --approval-timeout=0 returns as soon as
      # the upload is accepted instead of blocking the runner until a human at
      # Mozilla gets to it.
      - name: Submit the version
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          web-ext sign \
            --channel=listed \
            --source-dir=dist/extension \
            --artifacts-dir=dist/signed \
            --approval-timeout=0

  pypi:
    name: Publish Python distributions to PyPI
    needs: [verify, build, github-release]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/foxmcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/python
      - name: Verify tested distributions before publishing
        working-directory: dist/python
        run: sha256sum --check --strict PYTHON-SHA256SUMS
      # Configure a pending Trusted Publisher for ThinkerYzu/foxmcp,
      # workflow release.yml, environment pypi. No API token is needed.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python/packages/
          attestations: true
