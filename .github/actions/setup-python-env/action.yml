name: Set up the project venv
description: >
  Create venv/ and install the server and test dependencies into it, with pip's
  download cache carried between runs.

  The venv is created here rather than left to `make setup`, so that it is built
  from the interpreter actions/setup-python just installed rather than from
  whatever `python3` resolves to on the runner.

inputs:
  python-version:
    description: >
      Python version to install. Matches the venv the suite is green on locally.
      The project floor is 3.10, which is fastmcp 3's own; nothing is tested below
      this version.
    required: false
    default: '3.14'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          server/requirements.txt
          tests/requirements.txt

    - name: Create the venv the Makefile expects
      shell: bash
      run: python -m venv venv

    - name: Install server and test dependencies
      shell: bash
      run: make setup
