name: Install Firefox
description: >
  Install a Mozilla-built Firefox that permits unsigned extensions, and export
  FIREFOX_PATH for the integration tests.

  Deliberately not the distro package: Ubuntu ships Firefox as a snap, and the
  snap sandbox cannot read the temporary profile directories the tests build for
  it. The tarball from Mozilla has no such confinement.

  Deliberately not the release channel either. The tests install an unsigned XPI
  by dropping it into the profile, which needs
  xpinstall.signatures.required=false to be honoured -- and only Nightly,
  Developer Edition and unbranded builds honour it. Release and Beta ignore the
  pref and enforce signing regardless, so the extension silently never loads.

  The version check at the end is not decoration. tests/conftest.py *skips* when
  Firefox is unusable rather than failing, so a broken install would produce a
  green run of a suite that never touched a browser.

inputs:
  channel:
    description: >
      Which Firefox to install: devedition, nightly, or release.

      devedition is the default. It allows unsigned extensions, as the suite
      requires, and tracks beta -- so it moves every few weeks rather than
      nightly, which keeps upstream churn out of this project's CI.

      release is accepted so the value is not a lie, but the suite cannot pass
      against it. See above.
    required: false
    default: devedition

runs:
  using: composite
  steps:
    - name: Install the shared libraries Firefox needs
      shell: bash
      run: |
        sudo apt-get update
        # libdbus-glib is the one the runner image reliably lacks. The ALSA
        # package was renamed in the 64-bit time_t transition, so accept either
        # name rather than pinning to one Ubuntu release.
        sudo apt-get install -y --no-install-recommends libdbus-glib-1-2
        sudo apt-get install -y --no-install-recommends libasound2t64 \
          || sudo apt-get install -y --no-install-recommends libasound2

    - name: Download and unpack Firefox
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        case "$CHANNEL" in
          devedition) product=firefox-devedition-latest-ssl ;;
          nightly)    product=firefox-nightly-latest-ssl ;;
          release)
            product=firefox-latest-ssl
            echo "::warning::channel=release enforces extension signing, so the" \
                 "integration suite will skip every browser test. Use devedition."
            ;;
          *)
            echo "Unknown channel '$CHANNEL'; expected devedition, nightly or release." >&2
            exit 1
            ;;
        esac

        curl -fsSL "https://download.mozilla.org/?product=$product&os=linux64&lang=en-US" \
          -o "$RUNNER_TEMP/firefox.tar.xz"
        tar -xf "$RUNNER_TEMP/firefox.tar.xz" -C "$RUNNER_TEMP"
        echo "FIREFOX_PATH=$RUNNER_TEMP/firefox/firefox" >> "$GITHUB_ENV"

    - name: Check that it runs
      shell: bash
      run: |
        version="$("$FIREFOX_PATH" --version)"
        echo "$version"
        # Record the channel in the log. When a browser test starts failing, the
        # first question is which Firefox it ran against, and a version alone
        # does not answer it -- 153.0a1 and 153.0.4 differ in whether the
        # extension can load at all.
        echo "Channel: ${{ inputs.channel }}"
